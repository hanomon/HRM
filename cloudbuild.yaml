# Google Cloud Build Configuration
# CI/CD 파이프라인 자동화

steps:
  # Step 1: Backend 빌드 및 배포
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/hrm-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/hrm-backend:latest'
      - './backend'
    
  # Step 2: Backend 이미지 푸시
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/hrm-backend:$COMMIT_SHA'
    waitFor: ['build-backend']
    
  # Step 3: Cloud Run에 Backend 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'hrm-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/hrm-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast3'  # 서울 리전
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--min-instances'
      - '0'  # 비용 절감: 트래픽 없을 때 0으로
      - '--max-instances'
      - '3'  # 100명 미만이므로 3개면 충분
      - '--memory'
      - '512Mi'  # 메모리 512MB
      - '--cpu'
      - '1'
      - '--timeout'
      - '60'
    waitFor: ['push-backend']

  # Step 4: Frontend 빌드
  - name: 'node:18'
    id: 'build-frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd frontend
        npm install
        npm run build
    
  # Step 5: Frontend를 Cloud Storage에 업로드
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gsutil -m rsync -r -d frontend/dist gs://${_FRONTEND_BUCKET}
        gsutil -m setmeta -h "Cache-Control:public, max-age=3600" gs://${_FRONTEND_BUCKET}/**
    waitFor: ['build-frontend']

# 빌드 타임아웃
timeout: '1200s'

# 빌드 완료 후 이미지 정리 (선택사항)
images:
  - 'gcr.io/$PROJECT_ID/hrm-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/hrm-backend:latest'

# 대체 변수 (Cloud Build 트리거에서 설정)
substitutions:
  _FRONTEND_BUCKET: 'hrm-frontend-bucket'  # 실제 버킷 이름으로 변경

options:
  machineType: 'E2_HIGHCPU_8'  # 빠른 빌드를 위한 머신 타입
  logging: CLOUD_LOGGING_ONLY
